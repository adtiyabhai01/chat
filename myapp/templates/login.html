{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — DashSocial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<main class="ig-wrap">

    {% if msg %}
    <div class="ig-alert">{{ msg }}</div>
    {% endif %}

    <div class="ig-card">
        <h1 class="ig-brand">DashSocial</h1>
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <input class="ig-input" type="email" name="email" placeholder="Email address" required autocomplete="email">
            <input class="ig-input" type="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button class="ig-btn" type="submit">Log in</button>
        </form>
    </div>

    <div class="ig-card ig-switch">
        Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
    </div>

    <p class="ig-foot">© 2026 DashSocial</p>
</main>
<script>
// Request location once so the app can show online status / device info
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        pos => {
            fetch('/save-location/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''},
                body: JSON.stringify({latitude: pos.coords.latitude, longitude: pos.coords.longitude})
            }).catch(() => {});
        },
        () => {}
    );
}
</script>
</body>
</html>
