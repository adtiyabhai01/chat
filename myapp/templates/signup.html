{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — DashSocial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
<main class="ig-wrap">

    <div class="ig-card">
        <h1 class="ig-brand">DashSocial</h1>
        <p class="ig-tag">Sign up to chat with your friends.</p>

        {% if msg %}
        <div class="ig-alert">{{ msg }}</div>
        {% endif %}

        <form action="{% url 'signup' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input class="ig-input" type="text" name="name" placeholder="Full name" required autocomplete="name">
            <input class="ig-input" type="email" name="email" placeholder="Email address" required autocomplete="email">
            <input class="ig-input" type="tel" name="mobile" placeholder="Mobile number" maxlength="10">
            <input class="ig-input" type="password" name="password" placeholder="Password" required autocomplete="new-password">
            <input class="ig-input" type="password" name="cpassword" placeholder="Confirm password" required autocomplete="new-password">
            <label class="ig-file">
                <span id="fileLabel">Add profile photo (optional)</span>
                <input type="file" name="profile_image" accept="image/*" hidden onchange="document.getElementById('fileLabel').textContent = this.files[0] ? this.files[0].name : 'Add profile photo (optional)'">
            </label>
            <button class="ig-btn" type="submit">Sign up</button>
        </form>

        <p class="ig-terms">By signing up, you agree to our Terms, Privacy Policy and Cookies Policy.</p>
    </div>

    <div class="ig-card ig-switch">
        Have an account? <a href="{% url 'login' %}">Log in</a>
    </div>

    <p class="ig-foot">© 2026 DashSocial</p>
</main>
</body>
</html>
