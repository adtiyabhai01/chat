<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVIX Extension — Download</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px 36px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .icon { font-size: 52px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
  .btn { display: inline-block; background: #6366f1; color: #fff; text-decoration: none; padding: 13px 32px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: background .2s; }
  .btn:hover { background: #4f46e5; }
  .note { margin-top: 18px; font-size: 12px; color: #64748b; }
  .spinner { width: 38px; height: 38px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; margin: 0 auto 18px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div class="icon">📦</div>
  <h1>SOVIX Extension</h1>
  <p>Your download should start automatically. If it doesn't, tap the button below.</p>
  <a class="btn" href="{% url 'ext_download' %}" download>⬇ Download SOVIX.zip</a>
  <div class="note" id="status">Preparing download…</div>
</div>
<script>
  // Auto-download on page load — no login needed.
  window.addEventListener('load', function () {
    var link = document.createElement('a');
    link.href = "{% url 'ext_download' %}";
    link.download = "SOVIX.zip";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    var s = document.getElementById('status');
    var sp = document.getElementById('spinner');
    if (s) s.textContent = 'Download started. Check your downloads folder.';
    if (sp) sp.style.display = 'none';
  });
</script>
</body>
</html>
