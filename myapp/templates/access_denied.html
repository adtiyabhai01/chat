{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — DashSocial</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='70' font-size='60' font-family='Arial,sans-serif' font-weight='bold' text-anchor='middle' fill='white'>D</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<main class="ig-wrap">
    <div class="ig-card" style="text-align:center;">
        <div class="denied-icon"><i class="fas fa-ban"></i></div>
        <h1 class="denied-title">Access Denied</h1>
        <p class="denied-text">This account has been deactivated by the administrator and can no longer log in.{% if email %}<br><span class="denied-email">{{ email }}</span>{% endif %}</p>
        <a class="ig-btn" href="{% url 'login' %}">Back to Login</a>
    </div>
    <p class="ig-foot">© 2026 DashSocial</p>
</main>
</body>
</html>
