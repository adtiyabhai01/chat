{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/glass.css' %}">
    <link rel="stylesheet" href="{% static 'css/maintenance.css' %}">
</head>
<body>
    <div class="card">
        <div class="icon">⚙️</div>
        <h1>Under Maintenance</h1>
        <p>We're currently performing scheduled maintenance.<br>We'll be back shortly. Thank you for your patience!</p>
        <div class="status"><div class="dot"></div> Maintenance in progress</div>
    </div>

    <script>
        // Auto redirect when maintenance is off
        setInterval(() => {
            fetch('/admin-maintenance/')
                .then(r => r.json())
                .then(d => { if (!d.maintenance) location.reload(); })
                .catch(() => {});
        }, 10000);
    </script>
</body>
</html>
